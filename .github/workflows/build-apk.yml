name: Generar APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Restaurar carpeta app
        run: |
          unzip -o app_completa.zip -d temp_app
          rm -rf app/src/main
          mkdir -p app/src
          cp -r temp_app/app/src/main app/src/

      - name: Aplicar MainActivity actualizado
        run: |
          if [ -f "updates/MainActivity.kt" ]; then
            echo "Aplicando MainActivity.kt actualizado..."
            cp updates/MainActivity.kt app/src/main/java/com/example/finanzaspersonales/MainActivity.kt
          else
            echo "No hay actualización de MainActivity."
          fi

      - name: Aplicar identidad Foxfin
        run: |
          echo "Aplicando identidad Foxfin..."

          mkdir -p app/src/main/res/drawable

          if [ -f "foxfin_icon_512.png" ]; then
            cp foxfin_icon_512.png app/src/main/res/drawable/foxfin_icon.png
            echo "Icono Foxfin copiado correctamente."
          else
            echo "ERROR: No se encontró foxfin_icon_512.png"
            exit 1
          fi

          MANIFEST="app/src/main/AndroidManifest.xml"

          if grep -q 'android:label=' "$MANIFEST"; then
            sed -i 's#android:label="[^"]*"#android:label="Foxfin"#' "$MANIFEST"
          else
            sed -i 's#<application#<application android:label="Foxfin"#' "$MANIFEST"
          fi

          if grep -q 'android:icon=' "$MANIFEST"; then
            sed -i 's#android:icon="[^"]*"#android:icon="@drawable/foxfin_icon"#' "$MANIFEST"
          else
            sed -i 's#<application#<application android:icon="@drawable/foxfin_icon"#' "$MANIFEST"
          fi

          echo "Nombre e icono Foxfin configurados."

      - name: Verificar proyecto
        run: |
          echo "=== RAIZ DEL PROYECTO ==="
          ls -la

          echo "=== CARPETA APP ==="
          ls -la app

          echo "=== MAIN ==="
          ls -la app/src/main

          echo "=== MAIN ACTIVITY ==="
          ls -la app/src/main/java/com/example/finanzaspersonales/

          echo "=== ICONO FOXFIN ==="
          ls -la app/src/main/res/drawable/foxfin_icon.png

          echo "=== MANIFEST ==="
          cat app/src/main/AndroidManifest.xml

          echo "=== BUILD GRADLE ==="
          cat app/build.gradle.kts

          echo "=== GRADLE PROPERTIES ==="
          cat gradle.properties

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Compilar APK
        run: |
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Foxfin-APK
          path: "**/build/outputs/apk/debug/*.apk"
