name: Generar APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Restaurar carpeta app
        run: |
          unzip -o app_completa.zip -d temp_app
          rm -rf app/src/main
          mkdir -p app/src
          cp -r temp_app/app/src/main app/src/
          cp temp_app/app/build.gradle.kts app/build.gradle.kts

      - name: Verificar proyecto
        run: |
          echo "=== RAIZ DEL PROYECTO ==="
          ls -la
          echo "=== CARPETA APP ==="
          ls -la app
          echo "=== CARPETA MAIN ==="
          ls -la app/src/main
          echo "=== GRADLE PROPERTIES ==="
          cat gradle.properties

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Compilar APK
        run: |
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: FinanzasPersonales-APK
          path: "**/build/outputs/apk/debug/*.apk"
